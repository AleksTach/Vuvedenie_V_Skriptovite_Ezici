<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Wanderlist{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Manrope:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sunset: #fb923c;
        --peach: #fed7aa;
        --charcoal: #0f172a;
        --card: #111827;
        --muted: #9ca3af;
        --border: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 20% 20%,
            rgba(251, 146, 60, 0.25),
            rgba(15, 23, 42, 0.95) 50%,
            #020617
          ),
          #020617;
        color: #f8fafc;
        font-family: "Sora", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .nav-shell {
        padding: 1.5rem clamp(1.5rem, 6vw, 4rem);
      }

      nav {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.65rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(18px);
      }

      nav .brand {
        font-size: 1.1rem;
        letter-spacing: 0.2rem;
      }

      nav ul {
        display: flex;
        list-style: none;
        gap: 1.75rem;
        margin: 0;
        padding: 0;
        font-size: 0.95rem;
        font-family: "Manrope", sans-serif;
      }

      main {
        padding: 0 clamp(1.5rem, 6vw, 4rem) 4rem;
      }

      .glass-panel {
        border: 1px solid var(--border);
        border-radius: 32px;
        padding: clamp(1.5rem, 4vw, 3rem);
        background: rgba(15, 23, 42, 0.7);
        box-shadow: 0 35px 80px rgba(2, 6, 23, 0.65);
      }

      .messages {
        margin-bottom: 1.25rem;
        list-style: none;
        padding: 0;
      }

      .messages li {
        background: rgba(38, 173, 129, 0.18);
        border: 1px solid rgba(38, 173, 129, 0.5);
        border-radius: 16px;
        padding: 0.85rem 1.2rem;
        font-family: "Manrope", sans-serif;
      }

      footer {
        padding: 2rem clamp(1.5rem, 6vw, 4rem) 3rem;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      .hero-badge {
        text-transform: uppercase;
        letter-spacing: 0.3rem;
        color: var(--peach);
        font-size: 0.85rem;
      }

      .hero-highlight {
        color: var(--peach);
        font-family: "Manrope", sans-serif;
      }

      @media (max-width: 640px) {
        nav {
          flex-direction: column;
          gap: 0.8rem;
        }

        nav ul {
          flex-wrap: wrap;
          justify-content: center;
        }
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <div class="nav-shell">
      <nav>
        <span class="brand">WANDERLIST</span>
        <ul>
          <li><a href="/">Collection</a></li>
          <li><a href="/landing/">Hero demo</a></li>
          <li>
            <a
              href="https://docs.djangoproject.com/"
              target="_blank"
              rel="noreferrer"
              >Docs</a
            >
          </li>
        </ul>
      </nav>
    </div>
    <main>
      {% if messages %}
      <ul class="messages">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %} {% block content %}{% endblock %}
    </main>
    <footer>Built with Django · {{ request.path }}</footer>
  </body>
</html>
